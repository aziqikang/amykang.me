<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets the page reach the physical edges
         of the screen. Without it iOS lays the page out INSIDE the safe
         areas, so the background stops short of the Dynamic Island at the
         top and of the home indicator / URL bar at the bottom, and the
         flat html background shows through in both strips. Content that
         must stay clear of the notch uses env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- .ico first, SVG second: browsers that understand both prefer the
         later, richer declaration, and the ones that do not fall back to the
         .ico instead of silently requesting a missing one from the root.
         Only the SVG can follow the colour scheme, so it stays primary. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Amy Kang</title>
    <meta
      name="description"
      content="Amy Kang — math and computer science at Purdue. Work, teaching, research, and oil paintings."
    />

    <!-- Static OG tags. A React SPA ships no pre-rendered HTML, so these
         are what a link preview actually reads. They are site-wide by
         design; per-route previews would need a pre-render step.
         TODO: add <meta property="og:image"> once a preview image exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://amykang.me/" />
    <meta property="og:title" content="Amy Kang" />
    <meta
      property="og:description"
      content="Math and CS at Purdue. Work, teaching, research, and oil paintings."
    />
    <meta name="twitter:card" content="summary" />
    <!-- iOS Safari paints its status bar and URL bar with theme-color, so a
         single flat value showed as a clay strip above and below the page in
         BOTH themes — the "background cuts off" effect. One per scheme makes
         the browser chrome match the ground it sits against. The gradient
         itself cannot extend into Safari's chrome; matching it is the most
         that is available. -->
    <!-- Not the flat clay ground: these are the blue-teal glaze that the
         background field is actually full of (--glaze-mid in each theme), so
         Safari's bars read as part of the page rather than a strip bolted to
         the ends of it. Hard-coded because meta cannot reference a custom
         property — keep them in step with tokens.css if the glaze moves. -->
    <meta name="theme-color" content="#BCD9D6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#222B32" media="(prefers-color-scheme: dark)" />
    <!-- Was "light", from before dark mode existed. Claiming light-only makes
         the browser render form controls and its own canvas in light even
         when the page is dark. -->
    <meta name="color-scheme" content="light dark" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&family=Marcellus&family=Noto+Serif+SC:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Resolve the theme BEFORE first paint. Doing this in React would
      // mean a frame of the wrong palette on every load. Stores nothing
      // unless the visitor has explicitly overridden the system setting.
      ;(function () {
        try {
          var saved = localStorage.getItem('amykang.theme')
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 34rem">
        This site needs JavaScript to run. You can still reach me at
        <a href="mailto:aziqikang@gmail.com">aziqikang@gmail.com</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
